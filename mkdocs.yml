site_name: mog documentation
site_description: Deterministic L3 limit-order-book backtesting engine
site_url: https://kanakbarfa.github.io/mog/
repo_url: https://github.com/KanakBarfa/mog
repo_name: KanakBarfa/mog

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - tables

docs_dir: docs/site

nav:
  - Overview: index.md
  - Getting Started: getting-started.md
  - Examples: examples.md
  - Python API: python-api.md
  - Multi-Instrument: multi-instrument.md
  - Time Travel Debugger: time-travel-debugger.md
  - Microstructure & Fidelity:
      - Fidelity Guide: fidelity-guide.md
      - Model Bias Reference: model-bias-reference.md
      - C++26 Ledger Explainer: cpp26-ledger-explainer.md
  - Benchmarks:
      - Benchmark Results: benchmarks.md
      - Methodology: benchmark-methodology.md
  - Changelog: CHANGELOG.md
